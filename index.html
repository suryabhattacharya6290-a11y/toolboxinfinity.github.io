<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Toolbox Infinity - Multi-Utility SaaS Engine</title>
    <style>
        /* MILLION-DOLLAR ENTERPRISE GRADIENT OVERRIDES */
        html, body {
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 75%, #020617 100%) !important;
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100vh !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif !important;
            color: #f8fafc;
            overflow-x: hidden;
        }
        * { box-sizing: border-box; }

        /* PREMIUM DYNAMIC HUD NAVIGATION HEADER BAR */
        .hud-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .hud-brand {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff79c6, #00f2fe, #bd93f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .wallet-node {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        /* HARD-CORE WORKSPACE LAYOUT (RESPONSIVE SEAMLESS ENGINE) */
        .workspace-layout-matrix {
            padding: 40px 15px 100px 15px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: flex-start !important;
            min-height: calc(100vh - 68px) !important;
            width: 100% !important;
        }

        /* HIGH-END GLASSMORPHISM PLATFORM APPLICATION CONTAINER CARD */
        .saas-core-app-plate {
            background: rgba(15, 23, 42, 0.65) !important;
            backdrop-filter: blur(25px) !important;
            -webkit-backdrop-filter: blur(25px) !important;
            border: 2px solid rgba(0, 242, 254, 0.25) !important;
            padding: 35px 24px !important;
            border-radius: 28px !important;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.15) !important;
            width: 100% !important;
            max-width: 430px !important;
            box-sizing: border-box !important;
            text-align: center !important;
            margin-bottom: 25px !important;
        }
        .saas-lbl-category {
            color: #ff79c6 !important;
            font-size: 11px !important;
            font-weight: 800 !important;
            letter-spacing: 1.5px !important;
            text-transform: uppercase !important;
            margin-bottom: 6px !important;
            display: block !important;
        }
        .saas-core-app-plate h2 {
            font-size: 25px !important;
            font-weight: 900 !important;
            margin: 0 0 10px 0 !important;
            letter-spacing: -0.5px !important;
            color: #ffffff !important;
        }
        .saas-core-app-plate p {
            color: #94a3b8 !important;
            font-size: 13.5px !important;
            margin: 0 0 25px 0 !important;
            line-height: 1.6 !important;
        }

        /* 100% FIXED HIGH-CONTRAST CLICKABLE FILE LOADING PORTAL GRAPHIC */
        .stark-upload-reactor-box {
            border: 2px dashed rgba(0, 242, 254, 0.4) !important;
            padding: 40px 20px !important;
            border-radius: 20px !important;
            cursor: pointer !important;
            background: rgba(7, 11, 19, 0.5) !important;
            transition: all 0.3s ease !important;
            margin-bottom: 25px !important;
        }
        .stark-upload-reactor-box:hover {
            border-color: #ff79c6 !important;
            background: rgba(0, 242, 254, 0.04) !important;
        }
        .reactor-prompt-main-lbl {
            color: #f8f8f2 !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            display: block !important;
        }

        /* SLIDER ADJUSTMENT CONSOLE STYLES SHEET */
        .mechanical-range-console {
            background: rgba(10, 15, 26, 0.8) !important;
            padding: 16px !important;
            border-radius: 16px !important;
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            margin-bottom: 25px !important;
            text-align: left !important;
        }
        .console-meta-strip-row {
            display: flex !important;
            justify-content: space-between !important;
            color: #f8fafc !important;
            font-size: 13.5px !important;
            font-weight: 700 !important;
            margin-bottom: 8px !important;
            text-transform: uppercase !important;
        }
        .cyber-range-input-bar {
            width: 100% !important;
            height: 6px !important;
            background: #1e293b !important;
            border-radius: 10px !important;
            outline: none !important;
            -webkit-appearance: none !important;
            cursor: pointer !important;
        }
        .cyber-range-input-bar::-webkit-slider-thumb {
            -webkit-appearance: none !important;
            width: 18px !important;
            height: 18px !important;
            border-radius: 50% !important;
            background: #00f2fe !important;
            box-shadow: 0 0 10px #00f2fe !important;
        }

        /* LIVE TELEMETRY DISPLAY METRICS RACK GAUGE */
        .telemetry-board-rack {
            display: none;
            grid-template-columns: 1fr 1fr !important;
            gap: 12px !important;
            margin-bottom: 25px !important;
        }
        .telemetry-cell-unit-block {
            background: rgba(30, 41, 59, 0.5) !important;
            padding: 14px !important;
            border-radius: 16px !important;
            border: 1px solid rgba(255, 255, 255, 0.04) !important;
            text-align: center !important;
        }
        .unit-block-lbl-title { color: #64748b !important; font-size: 11px !important; display: block; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .unit-block-data-val { color: #00f2fe !important; font-size: 16px !important; font-weight: 800; }

        /* PREMIUM DYNAMIC INTERACTIVE CONVERSION TRIGGER ACTION BUTTON */
        .saas-trigger-payout-execution-btn {
            width: 100% !important;
            background: linear-gradient(135deg, #00f2fe 0%, #bd93f9 100%) !important;
            color: #ffffff !important;
            border: none !important;
            padding: 16px !important;
            font-size: 15px !important;
            font-weight: 800 !important;
            border-radius: 18px !important;
            cursor: pointer !important;
            transition: all 0.2s ease !important;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3) !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .saas-trigger-payout-execution-btn:hover {
            transform: translateY(-1px) !important;
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.45) !important;
        }

        /* FIXED BOTTOM NAVIGATION BAR WITH HUDS CHANNELS FOR DEVICE SCALES */
        .bottom-hud-ports-dock {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(20px) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            padding: 12px 10px !important;
            display: flex !important;
            justify-content: space-around !important;
            z-index: 1000 !important;
        }
        .hud-port-node-btn {
            background: transparent !important;
            border: none !important;
            color: #64748b !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 4px !important;
            text-transform: uppercase;
        }
        .hud-port-node-btn.active-node, .hud-port-node-btn:hover { color: #00f2fe !important; }
        .hud-port-node-btn span { font-size: 18px !important; }
    </style>
</head>
<body>

<div class="hud-header">
    <div class="hud-brand">Toolbox Infinity</div>
    <div class="wallet-node" id="globalWalletLedger">Balance: 0 XP ✨</div>
</div>

<div class="workspace-layout-matrix">
    <div class="saas-core-app-plate">
        <span class="saas-lbl-category">Compression Utilities</span>
        <h2>Client-Side Image Compressor</h2>
        <p>Compress heavy diagnostic images directly in your web browser container window with real-time scaling parameters seamlessly offline.</p>
        
        <!-- Native Secure Upload Elements Trigger Framework Links -->
